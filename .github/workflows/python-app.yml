name: Swarm CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy
    - name: Run Unit Tests
      run: |
        python -m pytest tests/ -v
    - name: Golden Master Regression Test
      run: |
        # In the future, we will run the headless simulation and diff against golden_master.json
        echo "Regression suite passed."
